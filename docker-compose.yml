version: "3.8"

services:
  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-crowdcarry}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crowdcarry_secret}
      POSTGRES_DB: ${DB_NAME:-crowdcarry}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${DB_USER:-crowdcarry}:${DB_PASSWORD:-crowdcarry_secret}@db:5432/${DB_NAME:-crowdcarry}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      PORT: "5000"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:5000
    restart: unless-stopped

volumes:
  pgdata:
